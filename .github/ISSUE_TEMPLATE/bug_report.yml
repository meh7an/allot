name: Bug report
description: Something does not work as described in the README or runbook.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start two Claude Code sessions
        2. ...
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: allot daemon status and allot status
      description: The output of both commands. Remove anything private.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant allotd.log lines
      description: From `logs/allotd.log` in `~/.allot` (`%USERPROFILE%\.allot` on Windows), if any.
      render: text
  - type: input
    id: os
    attributes:
      label: OS and desktop
      placeholder: Windows 11 24H2, macOS 26.1, or Ubuntu 24.04 with GNOME 46
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version and surface
      placeholder: 2.1.308, desktop app
    validations:
      required: true
