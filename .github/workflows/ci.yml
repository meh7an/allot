name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The PowerShell completions the Windows package ships: they parse, and complete a command.
      - name: Completions
        shell: pwsh
        run: |
          $script = (& target/debug/allot.exe completions powershell) -join "`n"
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; throw "the PowerShell completions do not parse" }
          Invoke-Expression $script
          $found = (TabExpansion2 'allot sta' 9).CompletionMatches.CompletionText
          if ($found -notcontains 'status') { throw "allot sta completes to: $found" }

  tray:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tray
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's preinstalled .NET SDK 10.0.402 is the one tray/global.json asks for.
      # setup-dotnet is not used: its aka.ms links lead to storage that refuses public reads.

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tray/**/*.csproj', 'tray/*.props') }}

      - name: Build
        run: dotnet build Allot.Tray.slnx

      - name: Test
        run: dotnet test --solution Allot.Tray.slnx --no-build

      # After the build, because the format check needs restored projects.
      - name: Format
        run: dotnet format Allot.Tray.slnx --verify-no-changes --no-restore

      # The release ships this Native AOT publish; its link finds the MSVC tools through
      # vswhere, which the targets call by bare name.
      - name: Publish
        shell: pwsh
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/Allot.Tray/Allot.Tray.csproj -c Release -o publish
          foreach ($file in 'allot-tray.exe', 'allot-tray.pri', 'Assets/AppIcon.ico',
                   'Microsoft.WindowsAppRuntime.Insights.Resource.dll') {
            if (-not (Test-Path "publish/$file")) { throw "the publish has no $file" }
          }

      # The release builds setup.exe with this script; stand-ins for the Rust binaries are
      # enough to check that it compiles. Same pinned Inno Setup as the release. The next step's
      # setup runs allot.exe, so its stand-in is a real program: for a file that is not one, cmd
      # opens an error dialog that nobody on the runner closes.
      - name: Installer script
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -OutFile $installer `
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') {
            throw "the Inno Setup installer has SHA-256 $hash"
          }
          $process = Start-Process $installer -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-'
          if ($process.ExitCode -ne 0) { throw "the Inno Setup install exited with $($process.ExitCode)" }
          $payload = "$env:RUNNER_TEMP\payload"
          New-Item -ItemType Directory $payload | Out-Null
          foreach ($exe in 'allotd.exe', 'allot-mcp.exe') { Set-Content "$payload\$exe" 'stand-in' }
          Copy-Item "$env:SystemRoot\System32\whoami.exe" "$payload\allot.exe"
          Copy-Item publish -Destination "$payload\tray" -Recurse
          & "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe" /Qp /DAppVersion=0.0.0 `
            "/DPayload=$payload" "/O$env:RUNNER_TEMP" ..\installer\allot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }

      # The stand-in allot.exe, whoami.exe, rejects the setup's arguments at once, so this checks
      # only what the setup does itself: the bin folder joins the user PATH once, even on a second
      # install, and leaves it on uninstall.
      - name: Installer PATH
        shell: pwsh
        timeout-minutes: 5
        run: |
          $bin = Join-Path $env:USERPROFILE '.allot\bin'
          function Get-BinEntries {
            $path = [Environment]::GetEnvironmentVariable('Path', 'User')
            @(($path ?? '') -split ';' | Where-Object { $_ -eq $bin }).Count
          }
          # -Wait would also wait for the processes the setup starts.
          function Invoke-Quietly([string] $exe) {
            $process = Start-Process $exe -PassThru -ArgumentList `
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
            $null = $process.Handle
            $process.WaitForExit()
          }
          $setup = "$env:RUNNER_TEMP\allot-0.0.0-setup.exe"
          Invoke-Quietly $setup
          Invoke-Quietly $setup
          if ((Get-BinEntries) -ne 1) { throw "the user PATH has $(Get-BinEntries) entries for $bin" }
          # The uninstaller hands over to a copy of itself in the temp folder and may exit first.
          $uninstaller = "$env:LOCALAPPDATA\Programs\Allot\unins000.exe"
          Invoke-Quietly $uninstaller
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path $uninstaller) -and (Get-Date) -lt $deadline) { Start-Sleep 1 }
          if (Test-Path $uninstaller) { throw "the uninstall did not finish" }
          if ((Get-BinEntries) -ne 0) { throw "the uninstall left $bin on the user PATH" }

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # Both Ubuntu runners report runner.os as Linux, so the key also names the architecture.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The completions and man page the packages ship, read by each shell and by man.
      - name: Install fish, zsh and man
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fish zsh man-db groff-base

      - name: Completions
        run: sh .github/scripts/check-completions.sh target/debug/allot
        env:
          CHECK_MAN: ${{ matrix.os == 'ubuntu-24.04' && '1' || '' }}

      # The generated contract types, each checked once on a runner with its toolchain.
      - name: Install pnpm
        if: matrix.os == 'ubuntu-24.04'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: contract/typescript/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          node-version: 24

      - name: Contract module
        if: matrix.os == 'ubuntu-24.04'
        working-directory: contract/typescript
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      # The GNOME extension's logic modules, against the same fixtures.
      - name: GNOME extension
        if: matrix.os == 'ubuntu-24.04'
        working-directory: apps/gnome
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      # The KDE widget's logic, the GNOME modules it shares, and its generated code being current.
      - name: KDE widget
        if: matrix.os == 'ubuntu-24.04'
        working-directory: apps/kde
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test

      - name: Contract package
        if: matrix.os == 'macos-15'
        working-directory: contract/swift
        run: swift test

      # The macOS app: its client and view models in a package, the app from project.yml.
      - name: App package
        if: matrix.os == 'macos-15'
        working-directory: apps/macos/AllotKit
        run: swift test

      - name: Install XcodeGen
        if: matrix.os == 'macos-15'
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $zip" \
            | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: App
        if: matrix.os == 'macos-15'
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project Allot.xcodeproj -scheme Allot -configuration Release \
            -derivedDataPath build build
          codesign --verify --strict build/Build/Products/Release/Allot.app

  # install.sh and install.ps1 against the published release, each into a throwaway home. The two
  # Windows shells run apart, since each install starts allotd and the tray app.
  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, shell: sh }
          - { os: ubuntu-24.04-arm, shell: sh }
          - { os: macos-15, shell: sh }
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        if: matrix.os == 'ubuntu-24.04'
        run: |
          shellcheck install.sh .github/scripts/test-install-sh.sh \
            .github/scripts/check-completions.sh .github/scripts/npm-packages.sh \
            .github/scripts/test-npm.sh .github/scripts/publish-crates.sh \
            .github/scripts/test-cargo-install.sh .github/scripts/test-binstall.sh

      - name: install.sh
        if: matrix.shell == 'sh'
        run: bash .github/scripts/test-install-sh.sh install.sh

      - name: install.ps1
        if: matrix.shell != 'sh'
        shell: pwsh
        run: .github/scripts/test-install-ps1.ps1 install.ps1 ${{ matrix.shell }}

  # The npm packages, packed from the latest release by the script distribute.yml publishes with.
  npm-pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          bash .github/scripts/npm-packages.sh "$tag" "$RUNNER_TEMP/npm"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm/
          if-no-files-found: error
          retention-days: 7

  # npm installs them from the tarballs into a throwaway prefix and home on each OS, then
  # `allot install` runs from the result. Windows' install starts allotd and the tray app.
  npm:
    needs: npm-pack
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm

      - name: Install with npm
        shell: bash
        run: bash .github/scripts/test-npm.sh "$RUNNER_TEMP/npm"

  # On each OS, since the code each crate compiles differs by platform: the publish dry run
  # (the Linux icons reach only a Linux build), then what a cargo user would run.
  crates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-crates-${{ hashFiles('Cargo.lock') }}

      - name: Publish dry run
        shell: bash
        run: bash .github/scripts/publish-crates.sh --dry-run

      - name: Install with cargo
        shell: bash
        run: bash .github/scripts/test-cargo-install.sh

      - name: Binstall metadata
        if: matrix.os == 'ubuntu-24.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/test-binstall.sh
