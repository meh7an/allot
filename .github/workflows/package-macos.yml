name: Package macOS

# The release workflow calls this on a tag. Run by hand, it builds the same packages as this
# run's artifacts and publishes nothing:
#   gh workflow run package-macos.yml --ref main
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable -vV | grep -qx "host: $TARGET"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-${{ hashFiles('Cargo.lock') }}

      - name: Check the app's version matches the workspace
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "allot-cli") | .version')
          grep -qx "    MARKETING_VERSION: \"$version\"" apps/macos/project.yml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked

      # `allot install` takes the binaries from the folder of the allot it runs from.
      - name: Package the binaries
        run: |
          name="allot-$VERSION-$TARGET"
          mkdir "$name"
          cp target/release/allot target/release/allotd target/release/allot-mcp \
            README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name"
          COPYFILE_DISABLE=1 tar --uid 0 --gid 0 -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      # A library outside the OS would have to come with the package.
      - name: Check what the binaries need
        run: |
          for file in allot allotd allot-mcp; do
            otool -L "$ASSET/$file" | tail -n +2 | awk '{ print $1 }'
          done | sort -u | tee needed.txt
          if grep -vE '^(/usr/lib|/System/Library)/' needed.txt; then
            echo "a binary needs a library the package cannot count on" >&2
            exit 1
          fi

      # From the archive, as a user would. No autostart or Claude Code here: the runner has
      # neither, and the unit tests cover them.
      - name: Try the package
        run: |
          try=$(mktemp -d)
          cp "$ASSET.tar.gz" "$ASSET.tar.gz.sha256" "$try"
          cd "$try"
          shasum -a 256 -c "$ASSET.tar.gz.sha256"
          tar -xzf "$ASSET.tar.gz"
          export HOME="$try/home"
          mkdir -p "$HOME/.local/bin"
          "$ASSET/allot" install --no-claude --no-autostart
          "$HOME/.local/bin/allot" status
          "$HOME/.local/bin/allot" --version | grep -qx "allot $VERSION"
          "$HOME/.local/bin/allot" uninstall --purge
          test ! -e "$HOME/.allot"

      - name: Install XcodeGen
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $zip" \
            | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # project.yml signs it ad hoc. ditto, because zip would drop what the signature covers.
      - name: Package the app
        run: |
          (
            cd apps/macos
            xcodegen generate
            xcodebuild -project Allot.xcodeproj -scheme Allot -configuration Release \
              -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
          )
          app=apps/macos/build/Build/Products/Release/Allot.app
          asset="allot-$VERSION-macos-app.zip"
          codesign --verify --strict "$app"
          test "$(lipo -archs "$app/Contents/MacOS/Allot")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist")" = "$VERSION"
          ditto -c -k --keepParent "$app" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          check=$(mktemp -d)
          ditto -x -k "$asset" "$check"
          codesign --verify --strict "$check/Allot.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allot-macos
          path: |
            ${{ env.ASSET }}.tar.gz
            ${{ env.ASSET }}.tar.gz.sha256
            allot-*-macos-app.zip
            allot-*-macos-app.zip.sha256
          if-no-files-found: error
