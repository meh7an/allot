name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock') }}

      # The image's preinstalled .NET SDK 10.0.402 is the one tray/global.json asks for.
      # setup-dotnet is not used: its aka.ms links lead to storage that refuses public reads.

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('tray/**/*.csproj', 'tray/*.props') }}

      - name: Check the tag matches the workspace and tray versions
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'allot').version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the workspace version $version"
          }
          $tray = (Select-Xml -Path tray/src/Allot.Tray/Allot.Tray.csproj `
            -XPath '//Version').Node.InnerText
          if ($tray -ne $version) {
            throw "the tray app's version $tray does not match the workspace version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      # Native AOT; its link finds the MSVC tools through vswhere, which the targets call by
      # bare name. Run in tray, so its global.json picks the SDK.
      - name: Publish the tray app
        shell: pwsh
        working-directory: tray
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer;$env:PATH"
          dotnet publish src/Allot.Tray/Allot.Tray.csproj -c Release `
            -o ../tray-publish
        env:
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"

      # `allot.exe install` takes the tray app from the tray folder beside it.
      - name: Package
        shell: pwsh
        run: |
          $name = "allot-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/allot.exe, target/release/allotd.exe, target/release/allot-mcp.exe,
            README.md, CHANGELOG.md, LICENSE-MIT, LICENSE-APACHE -Destination $name
          Copy-Item tray-publish -Destination "$name/tray" -Recurse
          Get-ChildItem "$name/tray" -Recurse -Filter *.pdb | Remove-Item
          if (-not (Test-Path "$name/tray/allot-tray.exe")) { throw "the package has no tray app" }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "$name.zip.sha256"
          "ASSET=$name" >> $env:GITHUB_ENV

      # Inno Setup 7.1.0, pinned by the SHA-256 GitHub publishes for the release asset; the
      # image only carries an older 6.x.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -OutFile $installer `
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') {
            throw "the Inno Setup installer has SHA-256 $hash"
          }
          $process = Start-Process $installer -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-'
          if ($process.ExitCode -ne 0) { throw "the Inno Setup install exited with $($process.ExitCode)" }

      - name: Build the installer
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" `
            "/DPayload=$PWD\$env:ASSET" "/O$PWD" installer\allot.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          $setup = "allot-$env:VERSION-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Set-Content -NoNewline "$setup.sha256"
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Extract release notes
        shell: bash
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { p = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$SETUP" "$SETUP.sha256" \
            "$ASSET.zip" "$ASSET.zip.sha256" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
