[package]
name = "allot-mcp"
description = "MCP server that lets Claude Code sessions lease CPU and GPU capacity from Allot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
allot-client = { version = "0.2.0", path = "../client" }
allot-core = { version = "0.2.0", path = "../core" }
allot-sampler = { version = "0.2.0", path = "../sampler" }
allot-shared = { version = "0.2.0", path = "../shared" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }
