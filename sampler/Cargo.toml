[package]
name = "allot-sampler"
description = "CPU, RAM, GPU, and VRAM sampling for Allot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
allot-core = { version = "0.2.0", path = "../core" }
allot-shared = { version = "0.2.0", path = "../shared" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "libc"] }

[dev-dependencies]
serde_json = "1.0.154"
