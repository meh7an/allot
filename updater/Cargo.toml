[package]
name = "allot-updater"
description = "Internal to Allot, no stable API: finds, downloads and checks Allot releases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
allot-shared = { version = "0.6.1", path = "../shared" }
flate2 = "1.1.11"
semver = "1.0.28"
sha2 = { version = "0.11.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile = "3.27.0"
