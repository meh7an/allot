[package]
name = "config-writeback"
description = "Throwaway spike for Settings M0.1: comment-preserving config.toml write-back"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
allot-core = { version = "0.5.0", path = "../../core" }
allot-shared = { version = "0.5.0", path = "../../shared" }
allotd = { version = "0.5.0", path = "../../daemon" }
toml_edit = "0.25.19"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
tracing-subscriber = "0.3.23"
