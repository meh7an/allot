<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allot Settings, Windows</title>
<link rel="stylesheet" href="mockups.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  .stage {
    padding: var(--s4);
  }

  .win {
    max-width: 1040px;
    margin: 0 auto;
    border: 1px solid var(--card-stroke);
    border-radius: var(--r-card);
    background: var(--bg);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: var(--s2);
    height: 48px;
    padding-left: var(--s4);
    font-size: 12px;
  }

  .titlebar .caption {
    margin-left: auto;
    display: flex;
  }

  .titlebar .caption span {
    width: 46px;
    height: 32px;
    display: grid;
    place-items: center;
    color: var(--text-2);
  }

  .titlebar svg {
    width: 16px;
    height: 16px;
  }

  .body {
    display: flex;
    min-height: 640px;
  }

  nav.pane {
    width: 240px;
    flex: none;
    display: flex;
    flex-direction: column;
    padding: 0 var(--s1) var(--s3);
  }

  nav.pane ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  nav.pane button {
    font: inherit;
    width: 100%;
    display: flex;
    gap: var(--s3);
    align-items: center;
    min-height: 36px;
    padding: 0 var(--s3);
    margin: 2px 0;
    border: 0;
    border-radius: var(--r-control);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    position: relative;
    text-align: left;
  }

  nav.pane button:hover {
    background: var(--subtle);
  }

  nav.pane button[aria-current="page"] {
    background: var(--subtle-strong);
  }

  nav.pane button[aria-current="page"]::before {
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
  }

  nav.pane svg {
    width: 16px;
    height: 16px;
  }

  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-2);
  }

  #save-status {
    margin-top: auto;
    padding: var(--s3);
    color: var(--text-2);
    font-size: 12px;
  }

  main.content {
    flex: 1 1 auto;
    min-width: 0;
    padding: var(--s2) var(--s6) var(--s6) var(--s5);
    border-top-left-radius: var(--r-card);
    background: var(--subtle);
  }

  .page-title {
    font-size: 28px;
    line-height: 36px;
    font-weight: 600;
    margin: var(--s3) 0 var(--s1);
  }

  .page-intro {
    color: var(--text-2);
    margin: 0 0 var(--s5);
    max-width: 640px;
  }

  .page-foot {
    display: flex;
    justify-content: flex-end;
    padding-top: var(--s2);
  }

  .status-row {
    display: flex;
    gap: var(--s3);
    align-items: center;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
  }

  .dot.ok {
    background: var(--success);
  }

  .dot.off {
    background: var(--text-2);
  }

  .dot.bad {
    background: var(--danger);
  }

  .rules {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .rules li {
    display: flex;
    gap: var(--s3);
    align-items: center;
    padding: var(--s2) var(--s2) var(--s2) var(--s4);
    min-height: 52px;
    position: relative;
  }

  .rules li + li {
    border-top: 1px solid var(--card-stroke);
  }

  .rules li.match {
    background: var(--match-bg);
  }

  .rule-num {
    width: 24px;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  .rule-main {
    flex: 1 1 auto;
    min-width: 0;
  }

  .rule-args {
    color: var(--text-2);
    font-size: 12px;
  }

  .rule-class {
    white-space: nowrap;
  }

  .match-tag {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .menu {
    position: absolute;
    right: var(--s2);
    top: 44px;
    z-index: 5;
    min-width: 180px;
    padding: var(--s1);
    border: 1px solid var(--card-stroke);
    border-radius: var(--r-card);
    background: var(--card);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }

  .menu button {
    font: inherit;
    display: flex;
    gap: var(--s3);
    align-items: center;
    width: 100%;
    min-height: 32px;
    padding: 0 var(--s3);
    border: 0;
    border-radius: var(--r-control);
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
  }

  .menu button:hover,
  .menu button:focus-visible {
    background: var(--subtle-strong);
  }

  .menu kbd {
    margin-left: auto;
    font: 12px var(--font);
    color: var(--text-2);
  }

  .menu svg {
    width: 16px;
    height: 16px;
  }

  .test-box {
    padding: var(--s3) var(--s4) var(--s4);
  }

  .test-box input {
    width: 100%;
    font-family: var(--mono);
  }

  .test-result {
    list-style: none;
    margin: var(--s2) 0 0;
    padding: 0;
  }

  .test-result li {
    margin-top: 4px;
  }

  .list-foot {
    display: flex;
    gap: var(--s2);
    flex-wrap: wrap;
    padding: var(--s3) var(--s4);
    border-top: 1px solid var(--card-stroke);
  }

  .list-status {
    margin: 0;
    padding: var(--s3) var(--s4);
    border-bottom: 1px solid var(--card-stroke);
    color: var(--text-2);
    font-size: 13px;
  }

  .radio-line {
    display: flex;
    gap: var(--s2);
    align-items: center;
    min-height: 32px;
  }

  .unit {
    color: var(--text-2);
  }

  .dlg-live {
    margin: var(--s4) 0 0;
    padding: var(--s3);
    border-radius: var(--r-control);
    background: var(--subtle);
    color: var(--text-2);
    font-size: 13px;
  }

  .dlg-warn {
    margin: 0 0 var(--s4);
    font-size: 13px;
  }

  .fit-caption {
    margin: 0;
    padding: var(--s3) var(--s4) 0;
    color: var(--text-2);
    font-size: 12px;
  }

  @media (max-width: 900px) {
    nav.pane {
      width: 56px;
    }

    nav.pane .nav-text,
    .nav-badge {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    #save-status {
      display: none;
    }

    main.content {
      padding: var(--s2) var(--s4) var(--s5);
    }
  }

  @media (max-width: 560px) {
    .stage {
      padding: 0;
    }

    .win {
      border-radius: 0;
    }

    .titlebar .caption {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="mock-bar">
  <h1>Allot Settings, Windows reference</h1>
  <label>State
    <select id="state-picker">
      <option value="normal">Normal</option>
      <option value="loading">Loading</option>
      <option value="field-error">Field refused by the service</option>
      <option value="restart">Restart needed (port changed)</option>
      <option value="conflict">Hand-edit conflict</option>
      <option value="invalid">config.toml has an error</option>
      <option value="stopped">Service stopped by you</option>
      <option value="unreachable">Service not answering</option>
      <option value="token">Key refused</option>
      <option value="notif-off">Notifications off in Windows</option>
    </select>
  </label>
  <label>Theme
    <select id="theme-picker">
      <option value="">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
  <a href="index.html">All mockups</a>
  <p class="mock-note">Machine numbers are a sample (16 cores, 32 GB, one GPU with 8 GB), not real data.</p>
</div>

<div class="stage">
  <div class="win" role="application" aria-label="Allot Settings window mockup">
    <div class="titlebar">
      <i data-lucide="gauge" aria-hidden="true"></i>
      <span>Allot Settings</span>
      <span class="caption" aria-hidden="true">
        <span><i data-lucide="minus"></i></span>
        <span><i data-lucide="square"></i></span>
        <span><i data-lucide="x"></i></span>
      </span>
    </div>
    <div class="body">
      <nav class="pane" aria-label="Settings pages">
        <ul id="nav"></ul>
        <p id="save-status" role="status" aria-live="polite">All changes saved</p>
      </nav>
      <main class="content" id="content" tabindex="-1"></main>
    </div>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
"use strict";

// ---------- Sample data (the spec's defaults; machine numbers are a labelled sample) ----------

const MACHINE = { cores: 16, ram: 32768, gpu: 100, vram: 8192, busyCores: 6, busyRam: 8192, cpuPct: 38 };

const DEFAULTS = {
  "panel.cpu": true, "panel.ram": true, "panel.gpu": true, "panel.vram": true,
  "panel.drives": true, "panel.drive_activity": true,
  "panel.service_stopped": true, "panel.running_long": true, "panel.benchmark_finished": true,
  "panel.job_finished": false, "panel.killed_outside": false, "panel.launch": true,
  "admission.headroom_pct": 15,
  "estimates.lower": true, "estimates.min_runs": 3, "estimates.margin_pct": 10,
  "benchmark.quiet_cpu_pct": 10, "benchmark.quiet_gpu_pct": 10,
  "benchmark.quiet_secs": 10, "benchmark.max_quiet_wait_secs": 60,
  "leases.heartbeat_ttl_secs": 60, "leases.idle_release_secs": 180,
  "retention.lease_days": 30, "retention.history_days": 90,
  "retention.keep_runs_per_job": 20, "retention.max_job_runs": 5000,
  "hook.fail_open": true, "daemon.port": 47823,
};

const CLASS_DEFAULTS = {
  light: { name: "Light", cores: 1, min: null, ram: 512, gpu: 0, vram: 0, secs: 30 },
  cpu_heavy: { name: "CPU heavy", cores: 8, min: null, ram: 4096, gpu: 0, vram: 0, secs: 300 },
  gpu_heavy: { name: "GPU heavy", cores: 2, min: null, ram: 4096, gpu: 80, vram: 4096, secs: 600 },
  mixed: { name: "Mixed", cores: 6, min: null, ram: 8192, gpu: 50, vram: 2048, secs: 600 },
};

const PRESET_DEFAULTS = {
  cpu_medium: { cores: 4, min: null, ram: 2048, gpu: 0, vram: 0, secs: 180 },
  cpu_small: { cores: 2, min: null, ram: 1024, gpu: 0, vram: 0, secs: 60 },
  gpu_small: { cores: 1, min: null, ram: 2048, gpu: 30, vram: 2048, secs: 300 },
  low_impact: { cores: 0.25, min: null, ram: 256, gpu: 0, vram: 0, secs: 60 },
  quick: { cores: 4, min: null, ram: 2048, gpu: 0, vram: 0, secs: 10 },
};

const RULE_DEFAULTS = [
  { program: "cargo", args: ["build", "test", "run", "bench"], cls: "cpu_heavy" },
  { program: "pnpm", args: ["build*", "test*"], cls: "cpu_heavy" },
  { program: "msbuild", args: [], cls: "cpu_heavy" },
  { program: "cmake", args: ["--build"], cls: "cpu_heavy" },
  { program: "python*", args: ["train*.py"], cls: "gpu_heavy" },
  { program: "py", args: ["train*.py"], cls: "gpu_heavy" },
];

const FLAG_DEFAULTS = ["--help", "-h", "--version", "-V", "/?"];

const clone = (value) => JSON.parse(JSON.stringify(value));
const values = { ...DEFAULTS };
const classes = clone(CLASS_DEFAULTS);
const presets = clone(PRESET_DEFAULTS);
let rules = clone(RULE_DEFAULTS);
let flags = [...FLAG_DEFAULTS];
let rulesCustom = false;
const errors = {};
let state = "normal";
let page = "admission";
let lastIdle = 180;

// ---------- Formatting ----------

const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const plural = new Intl.PluralRules(undefined);
const num = (n) => nf.format(n);

function unitText(n, unit) {
  return new Intl.NumberFormat(undefined, { style: "unit", unit, unitDisplay: "long", maximumFractionDigits: 2 }).format(n);
}

function duration(secs) {
  if (secs >= 3600 && secs % 3600 === 0) return unitText(secs / 3600, "hour");
  if (secs >= 60 && secs % 60 === 0) return unitText(secs / 60, "minute");
  return unitText(secs, "second");
}

function memory(mb) {
  if (mb >= 1024 && mb % 1024 === 0) return `${num(mb / 1024)} GB`;
  if (mb >= 1024) return `${num(mb / 1024)} GB`;
  return `${num(mb)} MB`;
}

function pct(n) {
  return `${num(n)} %`;
}

function runs(n) {
  return plural.select(n) === "one" ? `${num(n)} run` : `${num(n)} runs`;
}

// ---------- Fit math (stand-in for M2.2's fit preview, sample machine) ----------

function minCores(s) {
  return s.min ?? Math.max(s.cores / 2, Math.min(s.cores, 1));
}

function fits(s, idle) {
  const keep = 1 - values["admission.headroom_pct"] / 100;
  const avail = {
    cores: MACHINE.cores * keep - (idle ? 0 : MACHINE.busyCores),
    ram: MACHINE.ram * keep - (idle ? 0 : MACHINE.busyRam),
    gpu: MACHINE.gpu * keep,
    vram: MACHINE.vram * keep,
  };
  const count = (cores) => {
    const limits = [];
    if (cores > 0) limits.push(avail.cores / cores);
    if (s.ram > 0) limits.push(avail.ram / s.ram);
    if (s.gpu > 0) limits.push(avail.gpu / s.gpu);
    if (s.vram > 0) limits.push(avail.vram / s.vram);
    return limits.length ? Math.max(0, Math.floor(Math.min(...limits) + 1e-9)) : 99;
  };
  const full = count(s.cores);
  for (const key of Object.keys(avail)) {
    const used = { cores: s.cores, ram: s.ram, gpu: s.gpu, vram: s.vram }[key] * full;
    avail[key] -= used;
  }
  const min = minCores(s);
  const more = min < s.cores ? count(min) : 0;
  return { full, more, min };
}

function fitText(s, idle) {
  const f = fits(s, idle);
  if (f.full === 0 && f.more === 0) return "None fit";
  const parts = [`${num(f.full)} at full size`];
  if (f.more > 0) parts.push(`${num(f.more)} more at ${num(f.min)} cores`);
  return parts.join(", ");
}

function fitShort(s) {
  const f = fits(s, false);
  if (f.full === 0 && f.more === 0) return "None";
  return f.more > 0 ? `${num(f.full)}, ${num(f.more)} more shrunk` : num(f.full);
}

// ---------- Page definitions (labels and help from DESIGN.md section 4) ----------

const PAGES = [
  { id: "panel", title: "Panel", icon: "gauge", intro: "What the flyout shows and when Allot notifies you. These settings work even while the service is stopped.", local: true },
  { id: "admission", title: "Admission", icon: "scale", intro: "How much of this machine jobs may use, and how past runs change what a job reserves." },
  { id: "sizes", title: "Sizes", icon: "layers", intro: "Each heavy command reserves the size of its class. Presets are sizes a session can ask for by name." },
  { id: "commands", title: "Commands", icon: "terminal", intro: "Which shell commands count as heavy, and the class each one reserves." },
  { id: "benchmarks", title: "Benchmarks", icon: "timer", intro: "When the machine is quiet enough for a benchmark to start." },
  { id: "leases", title: "Leases", icon: "key-round", intro: "When leases end on their own, and how long their history is kept." },
  { id: "service", title: "Service", icon: "server", intro: "The background service that hands out leases, and how heavy commands behave while it is down." },
];

const ROWS = {
  "admission.headroom_pct": { label: "Headroom", help: "Share of cores, memory, GPU and video memory that jobs never get, so your desktop stays responsive.", type: "percent", min: 0, max: 99, below: 100 },
  "estimates.lower": { label: "Lower requests that past runs show are too big", help: "Once a command has used less than it asks for, reserve what it really uses. Requests always rise when runs used more. Benchmarks never lower.", type: "switch" },
  "estimates.min_runs": { label: "Runs before lowering", help: "Clean past runs of the same command in the same folder needed before its request lowers.", type: "count", min: 1, unit: "runs", needs: "estimates.lower", needsText: "Used only while lowering is on." },
  "estimates.margin_pct": { label: "Safety margin", help: "Added on top of what past runs used, so a slightly heavier run still fits.", type: "percent", min: 0, max: 100, needs: "estimates.lower", needsText: "Used only while lowering is on." },
  "benchmark.quiet_cpu_pct": { label: "CPU load limit", help: "A benchmark waits until total CPU load stays at or below this.", type: "percent", min: 0, max: 100 },
  "benchmark.quiet_gpu_pct": { label: "GPU load limit", help: "A benchmark waits until GPU load stays at or below this.", type: "percent", min: 0, max: 100 },
  "benchmark.quiet_secs": { label: "Quiet for", help: "How long both loads must stay under their limits, once no other lease is active.", type: "duration", min: 1 },
  "benchmark.max_quiet_wait_secs": { label: "Longest wait", help: "After this, a waiting benchmark starts anyway, marked not quiet.", type: "duration", min: 1, atLeast: "benchmark.quiet_secs" },
  "leases.heartbeat_ttl_secs": { label: "Lease timeout", help: "A lease ends when its session stops checking in for this long.", type: "duration", min: 1 },
  "leases.idle_release_secs": { label: "End leases left idle", help: "Ends a lease once nothing runs under it and its session has been idle, for sessions that forget to release.", type: "idle" },
  "retention.lease_days": { label: "Keep ended leases for", help: "Ended leases and their audit trail are deleted after this. Cleanup runs every hour.", type: "count", min: 1, unit: "days" },
  "retention.history_days": { label: "Keep job runs for", help: "Job runs are deleted after this, except each command's newest runs below.", type: "count", min: 1, unit: "days" },
  "retention.keep_runs_per_job": { label: "Always keep per command", help: "The newest runs of each command stay whatever their age, so estimates survive long breaks. Estimates read the newest 20.", type: "count", min: 1, unit: "runs" },
  "retention.max_job_runs": { label: "Most runs kept", help: "Beyond this, the oldest runs are deleted, whatever the command.", type: "count", min: 1, unit: "runs", atLeast: "retention.keep_runs_per_job" },
  "hook.fail_open": { label: "Let heavy commands run while the service is down", help: "When off, every heavy command is blocked until the service answers again.", type: "switch" },
  "daemon.port": { label: "Port", help: "The service listens on this port on 127.0.0.1. Change it only if another app needs the port.", type: "port", min: 1, max: 65535 },
  "panel.cpu": { label: "CPU", type: "switch", local: true },
  "panel.ram": { label: "RAM", type: "switch", local: true },
  "panel.gpu": { label: "GPU", type: "switch", local: true },
  "panel.vram": { label: "VRAM", type: "switch", local: true },
  "panel.drives": { label: "Drives", type: "switch", local: true },
  "panel.drive_activity": { label: "Drive activity", help: "Read and write rates on each drive row.", type: "switch", local: true, needs: "panel.drives", needsText: "Shown only with Drives.", nested: true },
  "panel.service_stopped": { label: "Service stopped", help: "When the service stops without you stopping it.", type: "switch", local: true },
  "panel.running_long": { label: "Running long", help: "When a job runs 1.5 times longer than expected.", type: "switch", local: true },
  "panel.benchmark_finished": { label: "Benchmark finished", help: "When a benchmark you started ends.", type: "switch", local: true },
  "panel.job_finished": { label: "Job finished", help: "When any job ends.", type: "switch", local: true },
  "panel.killed_outside": { label: "Killed outside the flyout", help: "When a job is stopped by something other than this flyout.", type: "switch", local: true },
  "panel.launch": { label: "Launch at logon", help: "Start Allot when you sign in.", type: "switch", local: true },
};

const LABEL_CACHE = (key) => ROWS[key].label;

function describe(key, value) {
  const row = ROWS[key];
  switch (row.type) {
    case "percent": return pct(value);
    case "duration": return duration(value);
    case "idle": return value === 0 ? "off" : duration(value);
    case "switch": return value ? "on" : "off";
    case "port": return String(value);
    default: return row.unit === "days" ? unitText(value, "day") : (row.unit === "runs" ? runs(value) : num(value));
  }
}

// ---------- Icons ----------

function icon(name) {
  return `<i data-lucide="${name}" aria-hidden="true"></i>`;
}

function paintIcons() {
  if (window.lucide) window.lucide.createIcons();
}

function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- Rows ----------

function readOnly() {
  return ["loading", "invalid", "stopped", "unreachable", "token"].includes(state);
}

function rowHtml(key) {
  const row = ROWS[key];
  const id = key.replace(/\./g, "-");
  const value = values[key];
  const disabled = row.needs && !values[row.needs];
  const changed = value !== DEFAULTS[key];
  const keyCode = row.local ? "" : `<code>${esc(key)}</code>`;
  const help = row.help || keyCode ? `<p class="row-help" id="${id}-help">${esc(row.help || "")}${keyCode}</p>` : "";
  const needs = disabled ? `<p class="row-msg">${esc(row.needsText)}</p>` : "";
  const err = errors[key] ? `<p class="row-msg error" id="${id}-msg">${icon("circle-alert")}<span>${esc(errors[key])}</span></p>` : "";
  const restart = key === "daemon.port" && state === "restart" ? `<p class="row-msg" id="${id}-msg">${icon("refresh-cw")}<span>Restart needed. The service still listens on 47823.</span></p>` : "";
  const described = [help && `${id}-help`, (err || restart) && `${id}-msg`].filter(Boolean).join(" ");
  const dis = disabled || (readOnly() && !row.local) ? " disabled" : "";
  const invalid = errors[key] ? ' aria-invalid="true"' : "";
  const shown = errors[key] && errors[`${key}#typed`] !== undefined ? errors[`${key}#typed`] : value;
  let control = "";

  if (row.type === "switch") {
    control = `<input type="checkbox" role="switch" id="${id}" data-key="${key}"${value ? " checked" : ""}${dis} aria-describedby="${described}">`;
  } else if (row.type === "percent") {
    control = `<input type="range" min="0" max="${row.max}" step="1" value="${value}" data-key="${key}" data-range aria-label="${esc(row.label)} slider"${dis} tabindex="-1">
      <input type="number" id="${id}" data-key="${key}" min="${row.min}" max="${row.max}" step="1" value="${shown}"${dis}${invalid} aria-describedby="${described}"><span class="unit" aria-hidden="true">%</span>`;
  } else if (row.type === "count" || row.type === "port") {
    const unit = row.unit ? `<span class="unit" aria-hidden="true">${row.unit}</span>` : "";
    control = `<input type="number" id="${id}" data-key="${key}" min="${row.min}"${row.max ? ` max="${row.max}"` : ""} step="1" value="${shown}"${dis}${invalid} aria-describedby="${described}">${unit}`;
  } else if (row.type === "duration" || row.type === "idle") {
    const secs = row.type === "idle" && value === 0 ? lastIdle : value;
    const unit = secs % 3600 === 0 && secs >= 3600 ? 3600 : secs % 60 === 0 && secs >= 60 ? 60 : 1;
    const opts = [[1, "seconds"], [60, "minutes"], [3600, "hours"]]
      .map(([n, t]) => `<option value="${n}"${n === unit ? " selected" : ""}>${t}</option>`).join("");
    const durDis = row.type === "idle" && value === 0 ? " disabled" : dis;
    const durationControl = `<input type="number" id="${id}" data-key="${key}" data-dur min="1" step="1" value="${secs / unit}"${durDis}${invalid} aria-describedby="${described}">
      <select data-key="${key}" data-unit aria-label="${esc(row.type === "idle" ? "Idle for" : row.label)} unit"${durDis}>${opts}</select>`;
    if (row.type === "idle") {
      const resetIdle = changed ? `<button class="icon-btn" data-reset="${key}" aria-label="Reset End leases left idle to on, 3 minutes">${icon("rotate-ccw")}</button>` : `<span class="reset-slot"></span>`;
      return `<div class="row">
          <div class="row-text"><label class="row-label" for="${id}-sw">${esc(row.label)}</label>${help}</div>
          <div class="row-control"><input type="checkbox" role="switch" id="${id}-sw" data-idle-switch${value ? " checked" : ""}${dis} aria-describedby="${id}-help">${resetIdle}</div>
        </div>
        <div class="row nested">
          <div class="row-text"><label class="row-label" for="${id}">Idle for</label><p class="row-help">How long the session must be idle first.</p>${err}</div>
          <div class="row-control">${durationControl}<span class="reset-slot"></span></div>
        </div>`;
    }
    control = durationControl;
  }

  const reset = changed && !row.local
    ? `<button class="icon-btn" data-reset="${key}" aria-label="Reset ${esc(row.label)} to ${esc(describe(key, DEFAULTS[key]))}"${readOnly() ? " disabled" : ""}>${icon("rotate-ccw")}</button>`
    : `<span class="reset-slot"></span>`;

  return `<div class="row${row.nested ? " nested" : ""}">
      <div class="row-text"><label class="row-label" for="${id}">${esc(row.label)}</label>${help}${needs}${err}${restart}</div>
      <div class="row-control">${control}${row.local ? "" : reset}</div>
    </div>`;
}

function group(title, keys, live, extra = "") {
  const rows = keys.map(rowHtml).join("");
  const liveHtml = live ? `<p class="live" aria-live="polite">${live}</p>` : "";
  return `<section class="group" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="card">${rows}${extra}${liveHtml}</div></section>`;
}

// ---------- Live sentences ----------

function liveHeadroom() {
  const keep = values["admission.headroom_pct"] / 100;
  return `Keeps <strong>${num(+(MACHINE.cores * keep).toFixed(1))}</strong> of ${num(MACHINE.cores)} cores, <strong>${num(+(MACHINE.ram * keep / 1024).toFixed(1))}</strong> of ${num(MACHINE.ram / 1024)} GB memory, <strong>${pct(values["admission.headroom_pct"])}</strong> of the GPU and <strong>${num(+(MACHINE.vram * keep / 1024).toFixed(1))}</strong> of ${num(MACHINE.vram / 1024)} GB video memory free.`;
}

function liveEstimates() {
  if (!values["estimates.lower"]) return "Requests are reserved as declared, or higher when past runs used more.";
  const reserved = +(3 * (1 + values["estimates.margin_pct"] / 100)).toFixed(2);
  return `A command that asks for 8 cores but used about 3 in its last <strong>${runs(values["estimates.min_runs"])}</strong> is reserved <strong>${num(reserved)} cores</strong>. Requests never go below 0.25 cores, 256 MB, or their minimum cores, and run time never lowers.`;
}

function liveBench() {
  return `A benchmark starts once CPU and GPU stay at or below <strong>${pct(values["benchmark.quiet_cpu_pct"])}</strong> and <strong>${pct(values["benchmark.quiet_gpu_pct"])}</strong> for <strong>${duration(values["benchmark.quiet_secs"])}</strong>. If that takes longer than <strong>${duration(values["benchmark.max_quiet_wait_secs"])}</strong>, it starts anyway, marked not quiet.`;
}

function liveLeases() {
  const idle = values["leases.idle_release_secs"];
  const idleText = idle === 0 ? "Leases left idle stay until their session releases them or stops checking in." : `A lease with nothing running ends after its session has been idle for <strong>${duration(idle)}</strong>.`;
  return `A lease ends <strong>${duration(values["leases.heartbeat_ttl_secs"])}</strong> after its session stops checking in. ${idleText}`;
}

function liveHistory() {
  return `Keeps ended leases for <strong>${unitText(values["retention.lease_days"], "day")}</strong> and job runs for <strong>${unitText(values["retention.history_days"], "day")}</strong>. Each command keeps at least its newest <strong>${num(values["retention.keep_runs_per_job"])}</strong> runs, and never more than <strong>${num(values["retention.max_job_runs"])}</strong> runs are stored.`;
}

// ---------- Banners ----------

function banner(kind, text, actions = []) {
  const iconName = { info: "info", warning: "triangle-alert", error: "circle-x" }[kind];
  const buttons = actions.map(([label, act]) => `<button class="btn" data-act="${act}">${esc(label)}</button>`).join("");
  return `<div class="banner ${kind}" role="${kind === "info" ? "status" : "alert"}"><span class="b-icon">${icon(iconName)}</span><p>${text}</p><div class="b-actions">${buttons}</div></div>`;
}

function pageBanners(p) {
  if (p.local) {
    return state === "notif-off" && p.id === "panel" ? "" : "";
  }
  switch (state) {
    case "conflict": return banner("warning", "config.toml changed outside Settings. Showing the file's values. Your change to Safety margin (15 %) was not saved.", [["Apply my change", "apply-mine"], ["Keep file's values", "dismiss"]]);
    case "invalid": return banner("error", "config.toml has an error: <code>admission.headroom_pct must be at least 0 and below 100</code>. The service keeps using its last good settings. Fix the file to change settings here.", [["Open file", "noop"], ["Check again", "dismiss"]]);
    case "stopped": return banner("info", "The service is stopped. Start it to change these settings.", [["Start service", "start"]]);
    case "unreachable": return banner("warning", "The service isn't answering on port 47823. Trying again every 5 s.", [["Try now", "dismiss"], ["Open logs", "noop"]]);
    case "token": return banner("error", "The service refused this panel's key. Restart the service to make a new one.", [["Restart service", "dismiss"]]);
    case "restart": return p.id === "service" ? banner("info", "Restart the service to use port 47999.", [["Restart service", "dismiss"]]) : "";
    default: return "";
  }
}

// ---------- Pages ----------

function renderPanel() {
  const notifBanner = state === "notif-off"
    ? `<div style="padding: var(--s3) var(--s4) 0">${banner("info", "Notifications for Allot are off in Windows Settings.", [["Open notification settings", "noop"]])}</div>`
    : "";
  return `<section class="group" aria-label="Meters"><h2>Meters</h2><p class="row-help" style="margin:0 0 8px">Rows shown in the flyout.</p><div class="card">${["panel.cpu", "panel.ram", "panel.gpu", "panel.vram", "panel.drives", "panel.drive_activity"].map(rowHtml).join("")}</div></section>
    <section class="group" aria-label="Notifications"><h2>Notifications</h2><div class="card">${notifBanner}${["panel.service_stopped", "panel.running_long", "panel.benchmark_finished", "panel.job_finished", "panel.killed_outside"].map(rowHtml).join("")}</div></section>
    ${group("Startup", ["panel.launch"])}`;
}

function renderAdmission() {
  const fitRows = Object.values(classes).map((s) => `<tr><th scope="row">${esc(s.name)}</th><td>${esc(fitText(s, false))}</td><td>${esc(fitText(s, true))}</td></tr>`).join("");
  const fitTable = `<section class="group" aria-label="What fits on this machine"><h2>What fits on this machine</h2><div class="card">
      <p class="fit-caption">Based on this machine now (${num(MACHINE.cpuPct)} % CPU busy) and with every lease ended. Sample numbers.</p>
      <div class="table-wrap"><table class="data"><thead><tr><th scope="col">Class</th><th scope="col">Now</th><th scope="col">When idle</th></tr></thead><tbody>${fitRows}</tbody></table></div></div></section>`;
  return group("Keep free for your desktop", ["admission.headroom_pct"], liveHeadroom())
    + group("Learn from past runs", ["estimates.lower", "estimates.min_runs", "estimates.margin_pct"], liveEstimates())
    + fitTable;
}

function sizeCells(s) {
  const minAuto = s.min === null;
  return `<td class="num">${num(s.cores)}</td>
    <td class="num">${num(minCores(s))}${minAuto ? '<span class="sub">automatic</span>' : ""}</td>
    <td class="num">${memory(s.ram)}</td><td class="num">${pct(s.gpu)}</td><td class="num">${memory(s.vram)}</td>
    <td class="num">${duration(s.secs)}</td><td>${esc(fitShort(s))}</td>`;
}

const HEAD = `<th scope="col" class="num">Cores</th><th scope="col" class="num">Minimum cores</th><th scope="col" class="num">Memory</th><th scope="col" class="num">GPU</th><th scope="col" class="num">Video memory</th><th scope="col" class="num">Run time</th><th scope="col">Fits now</th><th scope="col"><span class="sr">Actions</span></th>`;

function sameSize(a, b) {
  return a && b && ["cores", "min", "ram", "gpu", "vram", "secs"].every((k) => a[k] === b[k]);
}

function renderSizes() {
  const ro = readOnly() ? " disabled" : "";
  const classRows = Object.entries(classes).map(([key, s]) => {
    const changed = !sameSize(s, CLASS_DEFAULTS[key]);
    const reset = changed ? `<button class="icon-btn" data-reset-class="${key}" aria-label="Reset ${esc(s.name)} to its built-in size"${ro}>${icon("rotate-ccw")}</button>` : "";
    return `<tr><th scope="row">${esc(s.name)}<span class="sub mono">${key}</span></th>${sizeCells(s)}<td><button class="btn" data-edit-class="${key}"${ro}>Edit…</button>${reset}</td></tr>`;
  }).join("");
  const presetRows = Object.entries(presets).map(([key, s]) => {
    const builtIn = key in PRESET_DEFAULTS;
    const changed = builtIn && !sameSize(s, PRESET_DEFAULTS[key]);
    const extra = builtIn
      ? (changed ? `<button class="icon-btn" data-reset-preset="${key}" aria-label="Reset preset ${key} to its built-in size"${ro}>${icon("rotate-ccw")}</button>` : "")
      : `<button class="icon-btn" data-delete-preset="${key}" aria-label="Delete preset ${key}"${ro}>${icon("trash-2")}</button>`;
    return `<tr><th scope="row"><span class="mono">${key}</span>${builtIn ? '<span class="sub">built in</span>' : '<span class="sub">yours</span>'}</th>${sizeCells(s)}<td><button class="btn" data-edit-preset="${key}"${ro}>Edit…</button>${extra}</td></tr>`;
  }).join("");
  return `<section class="group" aria-label="Classes"><h2>Classes</h2><div class="card"><div class="table-wrap"><table class="data"><caption class="sr">Classes and their sizes</caption><thead><tr><th scope="col">Class</th>${HEAD}</tr></thead><tbody>${classRows}</tbody></table></div></div></section>
    <section class="group" aria-label="Presets"><h2>Presets</h2><div class="card"><div class="table-wrap"><table class="data"><caption class="sr">Presets and their sizes</caption><thead><tr><th scope="col">Preset</th>${HEAD}</tr></thead><tbody>${presetRows}</tbody></table></div>
      <div class="list-foot"><button class="btn" data-add-preset${ro}>${icon("plus")} Add preset…</button></div></div></section>`;
}

const CLASS_NAMES = { light: "Light", cpu_heavy: "CPU heavy", gpu_heavy: "GPU heavy", mixed: "Mixed" };

function renderCommands() {
  const ro = readOnly() ? " disabled" : "";
  const items = rules.length
    ? rules.map((r, i) => `<li data-rule="${i}">
        <span class="rule-num">${i + 1}</span>
        <span class="rule-main"><span class="mono">${esc(r.program)}</span><span class="rule-args"> ${r.args.length ? esc(r.args.join(" · ")) : "any arguments"}</span></span>
        <span class="match-tag" data-match-tag hidden>Matches</span>
        <span class="rule-class">${icon("arrow-right")} ${CLASS_NAMES[r.cls]}</span>
        <button class="icon-btn" data-rule-menu="${i}" aria-haspopup="menu" aria-expanded="false" aria-label="More options for rule ${i + 1}"${ro}>${icon("ellipsis")}</button>
      </li>`).join("")
    : `<li><span class="rule-main">No rules. No command counts as heavy, so the hook never asks for a lease.</span></li>`;
  const chips = flags.map((f, i) => `<li class="chip">${esc(f)}<button class="icon-btn" data-del-flag="${i}" aria-label="Remove ${esc(f)}"${ro}>${icon("x")}</button></li>`).join("");
  const flagsChanged = JSON.stringify(flags) !== JSON.stringify(FLAG_DEFAULTS);
  return `<section class="group" aria-label="Test a command"><h2>Test a command</h2><div class="card"><div class="test-box">
      <label for="test-cmd">Command line</label>
      <p class="row-help" id="test-help">Shows how the hook would treat this command with the rules below.</p>
      <input type="text" id="test-cmd" placeholder="cargo build --release" spellcheck="false" autocomplete="off" aria-describedby="test-help">
      <ul class="test-result" id="test-result" aria-live="polite"></ul></div></div></section>
    <section class="group" aria-label="Heavy-command rules"><h2>Heavy-command rules</h2><div class="card">
      <p class="list-status">${rulesCustom ? "Your rules. They replace the built-in list." : "Built-in rules."} <code>classifier.rules</code></p>
      <ol class="rules" id="rules" aria-label="Rules, checked in order">${items}</ol>
      <div class="list-foot"><button class="btn" data-add-rule${ro}>${icon("plus")} Add rule…</button><button class="btn" data-builtin-rules${rulesCustom ? "" : " disabled"}${ro}>Use built-in rules…</button></div></div></section>
    <section class="group" aria-label="Print-only flags"><h2>Print-only flags</h2><div class="card"><div class="row"><div class="row-text">
      <span class="row-label" id="flags-label">Print-only flags</span>
      <p class="row-help">A command with any of these only prints and exits, so it never needs a lease, even when a rule matches.<code>classifier.light_flags</code></p>
      <ul class="chips" aria-labelledby="flags-label" style="margin-top:8px">${chips}</ul>
      <div class="row-control" style="margin-top:8px"><input type="text" id="new-flag" aria-label="New print-only flag" placeholder="--dry-run"${ro}><button class="btn" data-add-flag${ro}>Add flag</button>
      ${flagsChanged ? `<button class="icon-btn" data-reset-flags aria-label="Reset print-only flags to the built-in list"${ro}>${icon("rotate-ccw")}</button>` : ""}</div>
    </div></div></div></section>`;
}

function renderBenchmarks() {
  return group("Quiet machine", ["benchmark.quiet_cpu_pct", "benchmark.quiet_gpu_pct", "benchmark.quiet_secs", "benchmark.max_quiet_wait_secs"], liveBench());
}

function renderLeases() {
  return group("Leases", ["leases.heartbeat_ttl_secs", "leases.idle_release_secs"], liveLeases())
    + group("History (advanced)", ["retention.lease_days", "retention.history_days", "retention.keep_runs_per_job", "retention.max_job_runs"], liveHistory());
}

function renderService() {
  const status = {
    stopped: ['<span class="dot off" aria-hidden="true"></span>', "Stopped. Heavy commands run without leases until you start it.", "Start service", "start"],
    unreachable: ['<span class="dot bad" aria-hidden="true"></span>', "Not answering on port 47823.", "Start service", "start"],
  }[state] || ['<span class="dot ok" aria-hidden="true"></span>', "Running · version 0.5.0 · port 47823", "Stop service", "stop"];
  const logs = state === "unreachable" ? `<button class="btn" data-act="noop">Open logs</button>` : "";
  return `<section class="group" aria-label="Service"><h2>Service</h2><div class="card"><div class="row">
      <div class="status-row">${status[0]}<span>${status[1]}</span></div>
      <div class="row-control"><button class="btn" data-act="${status[3]}">${status[2]}</button>${logs}</div></div></div></section>
    ${group("Connection", ["hook.fail_open", "daemon.port"])}
    <section class="group" aria-label="Files"><h2>Files</h2><div class="card"><div class="row">
      <div class="row-text"><span class="row-label">Config file</span><p class="row-help mono">C:\\Users\\[user]\\.allot\\config.toml</p></div>
      <div class="row-control"><button class="btn" data-act="noop">Open file</button><button class="btn" data-act="noop">Show in File Explorer</button></div></div></div></section>
    <section class="group" aria-label="Reset"><h2>Reset</h2><div class="card"><div class="row">
      <div class="row-text"><span class="row-label">Reset all service settings</span><p class="row-help">Every setting on the six service pages goes back to its default. Panel settings stay.</p></div>
      <div class="row-control"><button class="btn" data-reset-all${changedKeys(null).length && !readOnly() ? "" : " disabled"}>Reset all service settings…</button></div></div></div></section>`;
}

const RENDER = { panel: renderPanel, admission: renderAdmission, sizes: renderSizes, commands: renderCommands, benchmarks: renderBenchmarks, leases: renderLeases, service: renderService };

const PAGE_KEYS = {
  panel: Object.keys(DEFAULTS).filter((k) => k.startsWith("panel.")),
  admission: ["admission.headroom_pct", "estimates.lower", "estimates.min_runs", "estimates.margin_pct"],
  sizes: [], commands: [],
  benchmarks: ["benchmark.quiet_cpu_pct", "benchmark.quiet_gpu_pct", "benchmark.quiet_secs", "benchmark.max_quiet_wait_secs"],
  leases: ["leases.heartbeat_ttl_secs", "leases.idle_release_secs", "retention.lease_days", "retention.history_days", "retention.keep_runs_per_job", "retention.max_job_runs"],
  service: ["hook.fail_open", "daemon.port"],
};

function changedKeys(pageId) {
  const pages = pageId ? [pageId] : ["admission", "sizes", "commands", "benchmarks", "leases", "service"];
  const out = [];
  for (const p of pages) {
    for (const k of PAGE_KEYS[p]) if (values[k] !== DEFAULTS[k]) out.push([ROWS[k].label, describe(k, DEFAULTS[k]), k]);
    if (p === "sizes") {
      for (const [k, s] of Object.entries(classes)) if (!sameSize(s, CLASS_DEFAULTS[k])) out.push([`${s.name} size`, "built in", `classes.${k}`]);
      for (const [k, s] of Object.entries(presets)) if (!sameSize(s, PRESET_DEFAULTS[k])) out.push([`Preset ${k}`, k in PRESET_DEFAULTS ? "built in" : "deleted", `presets.${k}`]);
    }
    if (p === "commands") {
      if (rulesCustom) out.push(["Heavy-command rules", "built-in list", "classifier.rules"]);
      if (JSON.stringify(flags) !== JSON.stringify(FLAG_DEFAULTS)) out.push(["Print-only flags", "built-in list", "classifier.light_flags"]);
    }
  }
  return out;
}

function render() {
  const p = PAGES.find((x) => x.id === page);
  const nav = document.getElementById("nav");
  nav.innerHTML = PAGES.map((x) => {
    const badge = x.id === "service" && state === "restart" ? '<span class="nav-badge">Restart needed</span>' : "";
    return `<li><button data-page="${x.id}"${x.id === page ? ' aria-current="page"' : ""}>${icon(x.icon)}<span class="nav-text">${x.title}</span>${badge}</button></li>`;
  }).join("");
  const resetCount = changedKeys(p.id).length;
  const ro = readOnly() && !p.local;
  const foot = `<div class="page-foot"><button class="btn" data-reset-page${resetCount && !ro ? "" : " disabled"}>${resetCount ? `Reset page…` : "Nothing to reset"}</button></div>`;
  document.getElementById("content").innerHTML = `<h1 class="page-title">${p.title}</h1><p class="page-intro">${esc(p.intro)}</p>${pageBanners(p)}<div>${RENDER[p.id]()}</div>${foot}`;
  paintIcons();
  setStatus();
}

// ---------- Save status, toast ----------

let saveTimer;

function setStatus(text) {
  const el = document.getElementById("save-status");
  if (text) {
    el.textContent = text;
    return;
  }
  const bad = Object.keys(errors).filter((k) => !k.includes("#")).length;
  if (state === "loading") el.textContent = "Loading settings…";
  else if (bad) el.textContent = plural.select(bad) === "one" ? "1 change not saved" : `${bad} changes not saved`;
  else if (["stopped", "unreachable", "token", "invalid"].includes(state)) el.textContent = "Changes can't be saved now";
  else el.textContent = "All changes saved";
}

function saved() {
  setStatus("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => setStatus(), 600);
}

let toastTimer;

function toast(text, undo) {
  const el = document.getElementById("toast");
  el.innerHTML = `<span>${esc(text)}</span>${undo ? '<button class="btn link" id="toast-undo">Undo</button>' : ""}<button class="icon-btn" id="toast-close" aria-label="Close notice">${icon("x")}</button>`;
  el.hidden = false;
  paintIcons();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.hidden = true), 10000);
  if (undo) document.getElementById("toast-undo").onclick = () => { undo(); el.hidden = true; render(); };
  document.getElementById("toast-close").onclick = () => (el.hidden = true);
}

// ---------- Validation (mirrors Config::validate) ----------

function check(key, value) {
  const row = ROWS[key];
  if (!Number.isFinite(value)) return "Enter a number.";
  if (row.below !== undefined && (value < row.min || value >= row.below)) return `Enter a number from ${num(row.min)} to below ${num(row.below)}.`;
  if (row.max !== undefined && (value < row.min || value > row.max)) return `Enter a number from ${num(row.min)} to ${num(row.max)}.`;
  if (row.min !== undefined && value < row.min) return `Enter ${num(row.min)} or more.`;
  if (row.atLeast && value < values[row.atLeast]) return `Must be at least ${ROWS[row.atLeast].label} (${describe(row.atLeast, values[row.atLeast])}).`;
  return null;
}

function commit(key, value) {
  const problem = check(key, value);
  if (problem) {
    errors[key] = problem;
    errors[`${key}#typed`] = value;
    render();
    const input = document.getElementById(key.replace(/\./g, "-"));
    if (input) input.focus();
    return;
  }
  delete errors[key];
  delete errors[`${key}#typed`];
  const old = values[key];
  values[key] = value;
  if (key === "leases.idle_release_secs" && value > 0) lastIdle = value;
  render();
  ROWS[key].local ? setStatus() : saved();
  return old;
}

// ---------- Events ----------

document.addEventListener("click", (event) => {
  const t = event.target.closest("button");
  if (!t) return;
  if (t.dataset.page) {
    page = t.dataset.page;
    render();
    document.getElementById("content").focus();
  } else if (t.dataset.reset) {
    const key = t.dataset.reset;
    const old = values[key];
    values[key] = DEFAULTS[key];
    delete errors[key];
    render();
    saved();
    toast(`${ROWS[key].label} reset to ${describe(key, DEFAULTS[key])}.`, () => (values[key] = old));
  } else if (t.dataset.resetPage !== undefined) {
    confirmReset(changedKeys(page), `on ${PAGES.find((x) => x.id === page).title}`, () => resetPage(page));
  } else if (t.dataset.resetAll !== undefined) {
    confirmReset(changedKeys(null), null, () => ["admission", "sizes", "commands", "benchmarks", "leases", "service"].forEach(resetPage));
  } else if (t.dataset.editClass) {
    editSize("class", t.dataset.editClass);
  } else if (t.dataset.editPreset) {
    editSize("preset", t.dataset.editPreset);
  } else if (t.dataset.addPreset !== undefined) {
    editSize("new", null);
  } else if (t.dataset.resetClass) {
    const key = t.dataset.resetClass;
    const old = clone(classes[key]);
    classes[key] = clone(CLASS_DEFAULTS[key]);
    render(); saved();
    toast(`${old.name} reset to its built-in size.`, () => (classes[key] = old));
  } else if (t.dataset.resetPreset) {
    const key = t.dataset.resetPreset;
    const old = clone(presets[key]);
    presets[key] = clone(PRESET_DEFAULTS[key]);
    render(); saved();
    toast(`Preset ${key} reset to its built-in size.`, () => (presets[key] = old));
  } else if (t.dataset.deletePreset) {
    confirmDelete(t.dataset.deletePreset);
  } else if (t.dataset.ruleMenu) {
    openRuleMenu(t, Number(t.dataset.ruleMenu));
  } else if (t.dataset.addRule !== undefined) {
    editRule(null);
  } else if (t.dataset.builtinRules !== undefined) {
    confirmBuiltIn();
  } else if (t.dataset.delFlag) {
    flags.splice(Number(t.dataset.delFlag), 1);
    render(); saved();
  } else if (t.dataset.addFlag !== undefined) {
    const input = document.getElementById("new-flag");
    const v = input.value.trim();
    if (v && !flags.includes(v)) { flags.push(v); render(); saved(); }
  } else if (t.dataset.resetFlags !== undefined) {
    flags = [...FLAG_DEFAULTS]; render(); saved();
  } else if (t.dataset.act) {
    act(t.dataset.act);
  }
});

document.addEventListener("change", (event) => {
  const t = event.target;
  if (t.closest("dialog")) return;
  if (t.dataset.idleSwitch !== undefined) {
    commit("leases.idle_release_secs", t.checked ? lastIdle : 0);
  } else if (t.dataset.range !== undefined) {
    commit(t.dataset.key, Number(t.value));
  } else if (t.dataset.unit !== undefined) {
    const input = document.getElementById(t.dataset.key.replace(/\./g, "-"));
    commit(t.dataset.key, Number(input.value) * Number(t.value));
  } else if (t.dataset.dur !== undefined) {
    const unit = t.parentElement.querySelector("select").value;
    commit(t.dataset.key, Number(t.value) * Number(unit));
  } else if (t.type === "checkbox" && t.dataset.key) {
    commit(t.dataset.key, t.checked);
  } else if (t.type === "number" && t.dataset.key) {
    commit(t.dataset.key, t.value === "" ? NaN : Number(t.value));
  }
});

document.addEventListener("input", (event) => {
  const t = event.target;
  if (t.dataset.range !== undefined) {
    const box = document.getElementById(t.dataset.key.replace(/\./g, "-"));
    if (box) box.value = t.value;
  }
  if (t.id === "test-cmd") showTest(t.value);
});

document.addEventListener("keydown", (event) => {
  const t = event.target;
  if (event.key === "Escape" && t.dataset && t.dataset.key && errors[t.dataset.key]) {
    delete errors[t.dataset.key];
    delete errors[`${t.dataset.key}#typed`];
    render();
  }
  const li = t.closest && t.closest("li[data-rule]");
  if (li && event.altKey && (event.key === "ArrowUp" || event.key === "ArrowDown")) {
    event.preventDefault();
    moveRule(Number(li.dataset.rule), event.key === "ArrowUp" ? -1 : 1, true);
  }
  if (t.id === "new-flag" && event.key === "Enter") document.querySelector("[data-add-flag]").click();
});

function act(name) {
  if (name === "apply-mine" || name === "dismiss") {
    if (name === "apply-mine") values["estimates.margin_pct"] = 15;
    setState("normal");
  } else if (name === "start") {
    setState("normal");
    toast("Service started.");
  } else if (name === "stop") {
    stopDialog();
  }
}

// ---------- Dialogs ----------

const dlg = document.getElementById("dlg");

function openDialog(html, onReady) {
  dlg.innerHTML = html;
  paintIcons();
  dlg.showModal();
  if (onReady) onReady();
  const first = dlg.querySelector("input, select, button.primary");
  if (first) first.focus();
}

dlg.addEventListener("close", () => {
  const back = dlg.dataset.returnTo && document.querySelector(dlg.dataset.returnTo);
  if (back) back.focus();
});

function confirmReset(list, where, run) {
  const count = list.length;
  const title = where ? `Reset ${count} ${count === 1 ? "setting" : "settings"} ${where}?` : `Reset all ${count} changed ${count === 1 ? "setting" : "settings"}?`;
  const body = where
    ? "These go back to their defaults:"
    : "config.toml goes back to the defaults. Your rules and presets are replaced by the built-in ones, and presets you added are deleted. Comments next to these keys are removed too. This can't be undone.";
  const items = list.map(([label, def, key]) => `<li>${esc(label)}: ${esc(def)} <code>${esc(key)}</code></li>`).join("");
  openDialog(`<div class="dlg-body"><h2 id="dlg-title">${esc(title)}</h2><p>${esc(body)}</p><ul>${items}</ul></div>
    <div class="dlg-foot"><button class="btn primary" id="dlg-ok">Reset ${count} ${count === 1 ? "setting" : "settings"}</button><button class="btn" id="dlg-cancel">Cancel</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { run(); dlg.close(); render(); saved(); };
  document.getElementById("dlg-cancel").onclick = () => dlg.close();
}

function resetPage(p) {
  for (const k of PAGE_KEYS[p]) { values[k] = DEFAULTS[k]; delete errors[k]; }
  if (p === "sizes") {
    for (const k of Object.keys(classes)) classes[k] = clone(CLASS_DEFAULTS[k]);
    for (const k of Object.keys(presets)) delete presets[k];
    Object.assign(presets, clone(PRESET_DEFAULTS));
  }
  if (p === "commands") { rules = clone(RULE_DEFAULTS); rulesCustom = false; flags = [...FLAG_DEFAULTS]; }
}

function stopDialog() {
  openDialog(`<div class="dlg-body"><h2 id="dlg-title">Stop the service?</h2><p>2 jobs hold leases. They keep running, and new heavy commands run without leases until you start it again.</p></div>
    <div class="dlg-foot"><button class="btn primary" id="dlg-ok">Stop service</button><button class="btn" id="dlg-cancel">Cancel</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { dlg.close(); setState("stopped"); };
  document.getElementById("dlg-cancel").onclick = () => dlg.close();
}

function confirmDelete(key) {
  openDialog(`<div class="dlg-body"><h2 id="dlg-title">Delete preset ${esc(key)}?</h2><p>Sessions that ask for it by name get an error. You can add it again later.</p></div>
    <div class="dlg-foot"><button class="btn danger" id="dlg-ok">Delete preset</button><button class="btn" id="dlg-cancel">Cancel</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { delete presets[key]; dlg.close(); render(); saved(); };
  document.getElementById("dlg-cancel").onclick = () => dlg.close();
}

function confirmBuiltIn() {
  openDialog(`<div class="dlg-body"><h2 id="dlg-title">Use the built-in rules?</h2><p>Your ${rules.length} ${rules.length === 1 ? "rule is" : "rules are"} replaced by the 6 built-in ones. This can't be undone.</p></div>
    <div class="dlg-foot"><button class="btn primary" id="dlg-ok">Use built-in rules</button><button class="btn" id="dlg-cancel">Cancel</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { rules = clone(RULE_DEFAULTS); rulesCustom = false; dlg.close(); render(); saved(); };

}

function editSize(kind, key) {

function openRuleMenu(button, index) {
  closeMenus();
  const li = button.closest("li");
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  menu.setAttribute("aria-label", `Rule ${index + 1}`);
  const items = [
    ["edit", "pencil", "Edit…", ""],
    ["up", "arrow-up", "Move up", "Alt+Up", index === 0],
    ["down", "arrow-down", "Move down", "Alt+Down", index === rules.length - 1],
    ["delete", "trash-2", "Delete", "Del"],
  ];
  menu.innerHTML = items.map(([id, ic, text, kbd, off]) => `<button role="menuitem" data-mi="${id}"${off ? " disabled" : ""}>${icon(ic)}${text}${kbd ? `<kbd>${kbd}</kbd>` : ""}</button>`).join("");
  li.appendChild(menu);
  paintIcons();
  button.setAttribute("aria-expanded", "true");
  const buttons = [...menu.querySelectorAll("button:not([disabled])")];
  buttons[0].focus();
  menu.addEventListener("keydown", (e) => {
    const i = buttons.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); buttons[(i + 1) % buttons.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); buttons[(i - 1 + buttons.length) % buttons.length].focus(); }
    if (e.key === "Escape") { closeMenus(); button.focus(); }
  });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    e.stopPropagation();
    closeMenus();
    if (b.dataset.mi === "edit") editRule(index);
    if (b.dataset.mi === "up") moveRule(index, -1);
    if (b.dataset.mi === "down") moveRule(index, 1);
    if (b.dataset.mi === "delete") deleteRule(index);
  });
}

function closeMenus() {
  document.querySelectorAll(".menu").forEach((m) => m.remove());
  document.querySelectorAll("[data-rule-menu]").forEach((b) => b.setAttribute("aria-expanded", "false"));
}

document.addEventListener("pointerdown", (e) => { if (!e.target.closest(".menu") && !e.target.closest("[data-rule-menu]")) closeMenus(); });

function moveRule(i, delta, keepFocus) {
  const j = i + delta;
  if (j < 0 || j >= rules.length) return;
  [rules[i], rules[j]] = [rules[j], rules[i]];
  rulesCustom = true;
  render(); saved();
  const target = document.querySelector(`li[data-rule="${j}"] [data-rule-menu]`);
  if (target) target.focus();
}

function deleteRule(i) {
  const removed = rules.splice(i, 1)[0];
  const wasCustom = rulesCustom;
  rulesCustom = true;
  render(); saved();
  toast(`Rule ${i + 1} deleted.`, () => { rules.splice(i, 0, removed); rulesCustom = wasCustom; });
}

      <div class="field"><label for="r-prog">Program</label><p class="row-help" id="r-prog-h">The program's name without folder or extension, such as cargo or python*. * matches any characters, and case is ignored.</p>
        <input type="text" id="r-prog" value="${esc(r.program)}" spellcheck="false" autocomplete="off" aria-describedby="r-prog-h r-prog-e"><p class="row-msg error" id="r-prog-e"></p></div>
      <div class="field"><span class="field-label" id="r-args-l">Arguments</span><p class="row-help" id="r-args-h">Any one of these makes the command heavy; leave empty to match any arguments. A pattern starting with - matches that flag anywhere; others match the first argument that is not a flag.</p>

      <div class="field"><label for="r-class">Lease class</label><p class="row-help" id="r-class-h">The size a matching command reserves.</p>
        <select id="r-class" aria-describedby="r-class-h">${options}</select></div>
      <div class="field"><label for="r-test">Test this rule</label>
        <input type="text" id="r-test" placeholder="cargo build --release" spellcheck="false" autocomplete="off" style="width:100%;font-family:var(--mono)">
        <p class="dlg-live" id="r-test-out" aria-live="polite">Type a command line to see whether this rule matches it.</p></div></div>
      <div class="dlg-foot"><button class="btn primary" type="submit" id="dlg-ok">Save</button><button class="btn" type="button" id="dlg-cancel">Cancel</button></div></form>`);
  dlg.dataset.returnTo = index === null ? "[data-add-rule]" : `[data-rule-menu="${index}"]`;
  const chips = () => {
    document.getElementById("r-chips").innerHTML = r.args.map((a, i) => `<li class="chip">${esc(a)}<button class="icon-btn" type="button" data-rm="${i}" aria-label="Remove ${esc(a)}">${icon("x")}</button></li>`).join("") || '<li class="row-help">Any arguments</li>';
    paintIcons();
  };
  const test = () => {
    r.program = document.getElementById("r-prog").value.trim();
    r.cls = document.getElementById("r-class").value;
    const line = document.getElementById("r-test").value.trim();
    const out = document.getElementById("r-test-out");
    if (!line) { out.textContent = "Type a command line to see whether this rule matches it."; return; }
    const words = splitWords(line);
    const hit = r.program && ruleMatches(r, words);
    out.textContent = hit ? `Matches: this command would need a ${CLASS_NAMES[r.cls]} lease.` : "Doesn't match this rule.";
  };
  const progBad = () => {
    const bad = document.getElementById("r-prog").value.trim() === "";
    document.getElementById("r-prog-e").textContent = bad ? "Enter a program name, such as cargo." : "";
    document.getElementById("r-prog").setAttribute("aria-invalid", bad ? "true" : "false");
    return bad;
  };
  chips();
  dlg.querySelector("form").addEventListener("input", test);
  dlg.querySelector("form").addEventListener("change", test);
  document.getElementById("r-add").onclick = () => {
    const input = document.getElementById("r-arg");
    const v = input.value.trim();
    if (v) { r.args.push(v); input.value = ""; chips(); test(); }
    input.focus();
  };
  document.getElementById("r-arg").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); document.getElementById("r-add").click(); } });
  document.getElementById("r-chips").addEventListener("click", (e) => {
    const b = e.target.closest("[data-rm]");
    if (b) { r.args.splice(Number(b.dataset.rm), 1); chips(); test(); document.getElementById("r-arg").focus(); }
  });
  document.getElementById("dlg-cancel").onclick = () => dlg.close();
  dlg.querySelector("form").onsubmit = (e) => {
    if (progBad()) { e.preventDefault(); document.getElementById("r-prog").focus(); return; }
    r.program = document.getElementById("r-prog").value.trim();
    r.cls = document.getElementById("r-class").value;
    if (index === null) rules.push(r); else rules[index] = r;
    rulesCustom = true;
    setTimeout(() => { render(); saved(); }, 0);
  };
}

// ---------- The classifier (stand-in for M2.2's command test) ----------

function glob(pattern, text) {
  const re = new RegExp(`^${pattern.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*")}$`, "i");
  return re.test(text);
}

function splitWords(simple) {
  return simple.trim().split(/\s+/).filter(Boolean);
}

function programName(word) {
  const base = word.split(/[\\/]/).pop();
  return base.replace(/\.(exe|cmd|bat|ps1)$/i, "");
}

function ruleMatches(rule, words) {
  if (!words.length || !glob(rule.program, programName(words[0]))) return false;
  if (!rule.args.length) return true;
  const rest = words.slice(1);
  const positional = rest.find((w) => !w.startsWith("-") && !w.startsWith("+"));
  return rule.args.some((p) => (p.startsWith("-") ? rest.some((w) => glob(p, w)) : positional !== undefined && glob(p, positional)));
}

function classify(simple) {
  const words = splitWords(simple);
  if (!words.length) return null;
  const flag = words.slice(1).find((w) => flags.some((f) => f.toLowerCase() === w.toLowerCase()));
  const index = rules.findIndex((r) => ruleMatches(r, words));
  if (index >= 0 && flag) return { kind: "print", flag, simple };
  if (index >= 0) return { kind: "heavy", index, simple };
  return { kind: "none", simple };
}

function showTest(line) {
  const out = document.getElementById("test-result");
  document.querySelectorAll("li[data-rule]").forEach((li) => { li.classList.remove("match"); li.querySelector("[data-match-tag]").hidden = true; });
  out.textContent = "";
  const parts = line.split(/&&|\|\||;|\|/).map((s) => s.trim()).filter(Boolean);
  for (const part of parts) {
    const result = classify(part);
    if (!result) continue;
    const li = document.createElement("li");
    if (result.kind === "heavy") {
      const r = rules[result.index];
      const s = classes[r.cls];
      const anyOf = new Intl.ListFormat(undefined, { type: "disjunction" }).format(r.args);
      li.textContent = `Heavy: needs a ${CLASS_NAMES[r.cls]} lease (${num(s.cores)} cores, ${memory(s.ram)} memory). Rule ${result.index + 1}: ${r.program} with ${r.args.length ? anyOf : "any arguments"}.`;
      const row = document.querySelector(`li[data-rule="${result.index}"]`);
      if (row) { row.classList.add("match"); row.querySelector("[data-match-tag]").hidden = false; }
    } else if (result.kind === "print") {
      li.textContent = `Print-only: ${result.flag} only prints and exits, so no lease is needed.`;
    } else {
      li.textContent = `Not heavy: no rule matches ${part}.`;
    }
    out.appendChild(li);
  }
}

// ---------- States ----------

function setState(next) {
  state = next;
  document.getElementById("state-picker").value = next;
  for (const k of Object.keys(errors)) delete errors[k];
  values["daemon.port"] = DEFAULTS["daemon.port"];
  if (next === "field-error") {
    page = "admission";
    errors["admission.headroom_pct"] = "Headroom must be below 100 %.";
    errors["admission.headroom_pct#typed"] = 100;
  } else if (next === "restart") {
    page = "service";
    values["daemon.port"] = 47999;
  } else if (next === "notif-off") {
    page = "panel";
  } else if (next === "conflict") {
    page = "admission";
  }
  render();
}

document.getElementById("state-picker").addEventListener("change", (e) => setState(e.target.value));
document.getElementById("theme-picker").addEventListener("change", (e) => {
  if (e.target.value) document.documentElement.dataset.theme = e.target.value;
  else delete document.documentElement.dataset.theme;
});

const style = document.createElement("style");
style.textContent = ".sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}";
document.head.appendChild(style);

render();
</script>
