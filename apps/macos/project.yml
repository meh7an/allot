# The Allot menu bar app. `xcodegen generate` writes Allot.xcodeproj (not committed); the
# client, settings and view models live in the AllotKit package beside it.
name: Allot
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AllotKit:
    path: AllotKit
targets:
  Allot:
    type: application
    platform: macOS
    sources:
      - path: Allot
    dependencies:
      - package: AllotKit
        product: AllotKit
    scheme: {}
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Allot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        # allotd answers on loopback over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.mehran.allot
        PRODUCT_NAME: Allot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
