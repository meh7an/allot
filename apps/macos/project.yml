# The Allot menu bar app. `xcodegen generate` writes Allot.xcodeproj (not committed); the
# client, settings and view models live in the AllotKit package beside it.
name: Allot
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AllotKit:
    path: AllotKit
targets:
  Allot:
    type: application
    platform: macOS
    sources:
      - path: Allot
    dependencies:
      - package: AllotKit
        product: AllotKit
    # The release build passes ALLOT_HELPERS, the folder of `cargo build --release`: allot,
    # allotd and allot-mcp go into Contents/Helpers before Xcode signs the app, so its signature
    # covers them, and the app installs them into ~/.allot/bin. A build without it carries none
    # and never updates the service.
    postBuildScripts:
      - name: Bundle the service binaries
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          if [ -z "${ALLOT_HELPERS:-}" ]; then
            exit 0
          fi
          helpers="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          for name in allot allotd allot-mcp; do
            cp "$ALLOT_HELPERS/$name" "$helpers/$name"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --options runtime \
              --timestamp=none "$helpers/$name"
          done
    scheme: {}
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Allot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        # allotd answers on loopback over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.mehran.allot
        PRODUCT_NAME: Allot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # The script above reads the cargo build outside the project and runs codesign.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
