[package]
name = "allot-client"
description = "HTTP client for the Allot daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
allot-shared = { version = "0.2.0", path = "../shared" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
allot-core = { path = "../core" }
allotd = { path = "../daemon" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
