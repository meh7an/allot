[package]
name = "allot-cli"
description = "CLI for Allot: status, leases, history, daemon control, install, and the PreToolUse hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[[bin]]
name = "allot"
path = "src/main.rs"

[dependencies]
allot-client = { version = "0.2.0", path = "../client" }
allot-core = { version = "0.2.0", path = "../core" }
allot-sampler = { version = "0.2.0", path = "../sampler" }
allot-shared = { version = "0.2.0", path = "../shared" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
