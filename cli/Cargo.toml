[package]
name = "allot-cli"
description = "CLI for Allot: status, leases, history, daemon control, install, and the PreToolUse hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "allot"
path = "src/main.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/allot-{ version }-{ target }.tar.gz"
bin-dir = "allot-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/allot-{ version }-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
allot-client = { version = "0.3.0", path = "../client" }
allot-core = { version = "0.3.0", path = "../core" }
allot-sampler = { version = "0.3.0", path = "../sampler" }
allot-shared = { version = "0.3.0", path = "../shared" }
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
